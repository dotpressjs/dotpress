packages:
  - packages/*
  - examples/*

# Examples declare real versions (`^2.0.0-alpha.1`), so that they install as
# is once copied out of the repository; in the workspace, they get the local
# packages, whose versions satisfy these ranges (scripts/check-examples.mjs).
linkWorkspacePackages: true

allowBuilds:
  esbuild: true
  # Not needed: optional native speed-up of BullMQ (msgpackr), version
  # notice of protobufjs (Pub/Sub client), binary of workerd (Miniflare
  # tests), installed through its platform packages.
  msgpackr-extract: false
  protobufjs: false
  workerd: false
