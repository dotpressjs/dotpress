name: Release

# After a successful CI run of a push to main: opens or updates the "Version
# Packages" pull request while changesets are pending, and publishes the
# packages to npm once it is merged, then deploys the documentation site.
# Publishing uses npm trusted publishing (OIDC, with provenance): no npm
# token. The trusted publisher of each package names this file and the `npm`
# environment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run by hand, on main:
  # - dist-tags: sets the dist-tags of the current versions again, for
  #   instance after a failure of the publish job;
  # - website: deploys the documentation site, for instance to fix a page
  #   between two releases.
  workflow_dispatch:
    inputs:
      job:
        description: The job to run
        type: choice
        options: [dist-tags, website]

permissions: {}

# A release is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    # RELEASE_ENABLED: repository variable, set to true once the packages
    # exist on npm with their trusted publishers.
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit tested by CI.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the versions
      pull-requests: write # opens the "Version Packages" pull request
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The changelogs link each changeset to its commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          # Also updates pnpm-lock.yaml: the examples depend on the versions
          # of the packages, and CI installs with --frozen-lockfile.
          script: pnpm version-packages
        env:
          # For the links of the changelogs (@changesets/changelog-github).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # Named by the trusted publisher of each package: no other job can publish.
    environment: npm
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm trusted publishing
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # npm 11.21 or later: dist-tags with trusted publishing.
      - run: npm install --global npm@11.21.2
      - id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
      # changesets chooses the dist-tags from the versions on the registry
      # (npm placeholders such as 0.0.0-stage make it publish new packages to
      # the prerelease tag): set them explicitly. Needs "Allow npm dist-tag"
      # on the trusted publisher of each package.
      - if: steps.publish.outputs.published == 'true'
        run: node scripts/sync-dist-tags.mjs

  dist-tags:
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.job == 'dist-tags' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Trusted publishing: like the publish job.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.21.2
      # Node.js built-ins only: no dependencies to install.
      - run: node scripts/sync-dist-tags.mjs

  website:
    # After a release (the site documents the published versions), or by
    # hand on main.
    needs: publish
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_run' &&
          needs.publish.outputs.published == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          inputs.job == 'website' &&
          github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    # Holds the Cloudflare settings: CLOUDFLARE_API_TOKEN (secret, "Edit
    # Cloudflare Workers" limited to the account and the dotpress.dev zone)
    # and CLOUDFLARE_ACCOUNT_ID (variable).
    environment: website
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The released commit, or main for a run by hand.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The site and the packages it compiles its examples against.
      - run: pnpm --filter "dotpress-website..." build
      - run: npx --yes wrangler@4.161.0 deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
