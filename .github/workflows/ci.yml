name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    # Integration tests of the event transports and cache stores (skipped
    # without them).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Upstash REST API in front of the Redis service.
      upstash:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: test-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      VALKEY_URL: redis://localhost:6380
      UPSTASH_URL: http://localhost:8079
      UPSTASH_TOKEN: test-token
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/events
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm check:core
      - run: pnpm check:packages
      - run: pnpm check:examples
      - run: pnpm typecheck
      - run: pnpm test

  packed:
    # The packages as they would be published, installed in a new project
    # with npm: nothing is published.
    name: Packed packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node.js of `engines` (require() of ES modules), and the
        # latest.
        node: ['22.12', 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # tsup needs Node.js 22.18 or later to build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test:packed

  release-dry-run:
    # The release of the Release workflow, replayed on a local registry
    # (Verdaccio): versions, dist-tags, @dotpress/auth 1.x kept as latest.
    name: Release dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The changelogs link each changeset to its pull request: reading the
      # pull request of a commit needs this permission.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelogs link each changeset to its commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a local registry
        run: |
          docker run -d --name verdaccio -p 4873:4873 \
            -v "$PWD/scripts/verdaccio.yaml:/verdaccio/conf/config.yaml:ro" \
            verdaccio/verdaccio:6.11.1
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4873/-/ping && exit 0
            sleep 1
          done
          docker logs verdaccio
          exit 1
      - run: pnpm release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
